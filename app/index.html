<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.anthropic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IronFuel">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>IronFuel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>IronFuel</h1>
      <p id="countdown"></p>
    </div>
    <button id="openSettings" class="icon-btn" aria-label="Instellingen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <section id="view-today" class="view" aria-label="Vandaag">
      <nav class="datebar" aria-label="Dag kiezen">
        <button id="prevDay" class="icon-btn" aria-label="Vorige dag"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="dateLabel" class="date-label"></button>
        <button id="nextDay" class="icon-btn" aria-label="Volgende dag"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </nav>
      <div id="summary"></div>
      <div class="section-row">
        <h2 class="section-title">Training</h2>
        <button id="addTraining" class="link">+ Training</button>
      </div>
      <ul id="trainings" class="list"></ul>
      <h2 class="section-title">Gegeten</h2>
      <ul id="items" class="list"></ul>
    </section>

    <section id="view-food" class="view" aria-label="Eten" hidden>
      <h2 class="section-title">Eigen maaltijd</h2>
      <div class="card custom">
        <button id="manualBtn" class="secondary wide">+ Maaltijd met eigen macro's</button>
        <p class="or">of laat Claude schatten (kost API-tegoed)</p>
        <label for="customText" class="sr-only">Beschrijf wat je hebt gegeten</label>
        <textarea id="customText" class="field" rows="2" maxlength="500" placeholder="Bijv. bord pad thai met kip en een blikje cola"></textarea>
        <button id="estimateBtn" class="secondary wide">Laat Claude schatten</button>
        <div id="estimate" aria-live="polite"></div>
      </div>
      <h2 class="section-title">Standaardmaaltijden</h2>
      <div id="mealGrid" class="grid"></div>
    </section>

    <section id="view-coach" class="view" aria-label="Coach" hidden>
      <div class="section-row">
        <h2 class="section-title">Coach · <span id="coachDate"></span></h2>
        <button id="newChat" class="link">Nieuw gesprek</button>
      </div>
      <div id="chat" class="chat" aria-live="polite"></div>
      <div class="composer">
        <div class="chips quick" role="group" aria-label="Snelle vragen">
          <button type="button" class="chip">Wat kan ik nu nog het beste eten?</button>
          <button type="button" class="chip">Wat had ik vandaag beter anders kunnen eten?</button>
          <button type="button" class="chip">Wat eet ik voor en na mijn training?</button>
        </div>
        <form id="askForm" class="ask">
          <textarea id="askText" rows="1" maxlength="2000" placeholder="Vraag iets aan je coach…" aria-label="Je vraag"></textarea>
          <button class="send" aria-label="Versturen"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </form>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Menu">
    <button data-view="today" aria-current="page">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Vandaag</span>
    </button>
    <button data-view="food">
      <svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4.5-3.5 8H17"/></svg>
      <span>Eten</span>
    </button>
    <button data-view="coach">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-11.7 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/></svg>
      <span>Coach</span>
    </button>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="meals.js"></script>
  <script src="store.js"></script>
  <script src="claude.js"></script>
  <script src="app.js"></script>
</body>
</html>
